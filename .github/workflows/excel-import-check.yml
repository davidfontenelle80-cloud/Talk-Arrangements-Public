name: Excel import check
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/excel-import.js
      - run: node tests/excel-import.test.js
      - run: node --check js/year-report.js
      - run: node tests/year-report.test.js
      - run: node --check js/state-validation.js
      - run: node tests/state-validation.test.js
      - run: node tests/error-boundary.test.js
      - run: node tests/print-wiring.test.js
      - run: node scripts/check-encoding.mjs .
