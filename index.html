<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talk Arrangements</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#f6f7f4;--panel:#ffffff;--panel-2:#eef3f0;
      --text:#17201c;--muted:#637067;--line:#d8ded9;
      --accent:#0e7c66;--warn:#ab6116;--danger:#b3261e;--ok:#237247;
      --shadow:0 12px 30px rgba(20,33,28,.09);--radius:8px;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
    }
    [data-theme="dark"]{color-scheme:dark;--bg:#121715;--panel:#1b2220;--panel-2:#232c29;--text:#eaf0ec;--muted:#a8b5ad;--line:#34413c;--accent:#54c2a8;--warn:#e0a85b;--danger:#ff8a80;--ok:#78d7a0;--shadow:0 16px 38px rgba(0,0,0,.25);}
    @media(prefers-color-scheme:dark){[data-theme="system"]{color-scheme:dark;--bg:#121715;--panel:#1b2220;--panel-2:#232c29;--text:#eaf0ec;--muted:#a8b5ad;--line:#34413c;--accent:#54c2a8;--warn:#e0a85b;--danger:#ff8a80;--ok:#78d7a0;--shadow:0 16px 38px rgba(0,0,0,.25);}}
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-size:15px;}
    button,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);}
    button{cursor:pointer;min-height:36px;padding:7px 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
    button:hover,select:hover{border-color:color-mix(in srgb,var(--accent),var(--line) 35%);}
    .icon-btn{width:36px;padding:0;font-size:17px;}
    .primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
    [data-theme="dark"] .primary,[data-theme="system"] .primary{color:#08231d;}
    .danger{color:var(--danger);}
    .app-shell{max-width:1480px;margin:0 auto;padding:18px;}
    header{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;margin-bottom:8px;}
    h1{margin:0;font-size:clamp(22px,3vw,40px);line-height:1.05;}
    .subhead{margin-top:4px;color:var(--muted);font-size:14px;}
    #dataBadge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid;margin-top:4px;}
    .badge-private{background:color-mix(in srgb,var(--ok),var(--panel) 82%);color:var(--ok);border-color:var(--ok);}
    .badge-public{background:color-mix(in srgb,var(--warn),var(--panel) 82%);color:var(--warn);border-color:var(--warn);}
    .toolbar{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;}
    .segmented{display:inline-grid;grid-auto-flow:column;gap:3px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);}
    .segmented button{border:0;background:transparent;min-height:30px;padding:5px 10px;}
    .segmented button.active{background:var(--panel);box-shadow:0 1px 8px rgba(0,0,0,.08);color:var(--accent);font-weight:700;}
    nav{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-top:14px;margin-bottom:18px;overflow-x:auto;}
    nav button{border:0;border-radius:0;background:transparent;min-width:128px;padding:13px 14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;}
    nav button.active{color:var(--text);border-color:var(--accent);font-weight:800;}
    section[hidden]{display:none;}
    .section-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:12px;flex-wrap:wrap;}
    .section-head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    h2{font-size:21px;margin:0 0 4px;}
    .section-head p,.muted{color:var(--muted);margin:0;}
    .grid{display:grid;gap:14px;}
    .dashboard-layout{grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);align-items:start;}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
    .panel-title{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;}
    .panel-title strong{font-size:15px;}
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    table{width:100%;border-collapse:collapse;min-width:680px;}
    th,td{border-bottom:1px solid var(--line);padding:8px;vertical-align:middle;text-align:left;}
    th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:color-mix(in srgb,var(--panel-2),transparent 20%);white-space:nowrap;}
    tbody tr.current{background:color-mix(in srgb,var(--accent),transparent 86%);box-shadow:inset 4px 0 0 var(--accent);}
    tbody tr:hover{background:color-mix(in srgb,var(--panel-2),transparent 38%);}
    td select,td input{padding:6px 7px;}
    .status-select{font-weight:600;min-width:140px;width:100%;}
    .s-not-contacted{color:var(--muted);}
    .s-message-sent{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn),var(--panel) 88%);}
    .s-confirmed{color:var(--ok);border-color:var(--ok);background:color-mix(in srgb,var(--ok),var(--panel) 88%);}
    .s-needs-follow-up{color:var(--danger);border-color:var(--danger);background:color-mix(in srgb,var(--danger),var(--panel) 88%);}
    .followup-overdue{color:var(--danger);font-weight:700;}
    .followup-soon{color:var(--warn);font-weight:700;}
    input.fu-overdue{border-color:var(--danger);}
    input.fu-soon{border-color:var(--warn);}
    .conflict-banner{border:1px solid var(--warn);border-radius:var(--radius);background:color-mix(in srgb,var(--warn),var(--panel) 90%);margin-bottom:12px;}
    .conflict-banner-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;gap:10px;user-select:none;}
    .conflict-banner-header .warn-label{color:var(--warn);font-weight:700;font-size:14px;}
    .conflict-banner-body{padding:0 14px 10px;display:none;}
    .conflict-banner-body.open{display:block;}
    .conflict-item{padding:3px 0;font-size:13px;color:var(--warn);}
    .contact-card{padding:14px;display:grid;gap:12px;}
    .contact-name{font-size:20px;font-weight:800;word-break:break-word;overflow-wrap:break-word;line-height:1.2;}
    .contact-meta{display:grid;gap:5px;color:var(--muted);font-size:14px;}
    .action-row{display:flex;flex-wrap:wrap;gap:8px;}
    .template-box{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.55;color:var(--text);white-space:pre-wrap;word-break:break-word;}
    .template-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
    .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;}
    .kpi{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:78px;}
    .kpi b{display:block;font-size:26px;line-height:1;margin-bottom:6px;}
    .kpi span{color:var(--muted);font-size:12px;}
    .planning-year{margin-bottom:16px;}
    .planning-year table{min-width:660px;}
    .list-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
    .search{min-width:min(320px,100%);padding:9px 10px;}
    .field-cell{display:flex;align-items:center;gap:4px;}
    .field-cell input{flex:1;min-width:0;}
    .copy-field-btn{width:30px;height:30px;min-height:30px;padding:0;font-size:13px;flex-shrink:0;color:var(--muted);}
    .copy-field-btn:hover{color:var(--accent);}
    .toast{position:fixed;right:18px;bottom:18px;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s ease;z-index:20;max-width:min(420px,calc(100vw - 36px));font-size:14px;}
    .toast.show{opacity:1;transform:translateY(0);}
    .file-input{display:none;}
    .empty{padding:22px;color:var(--muted);text-align:center;}
    .pill{display:inline-flex;align-items:center;min-height:26px;border-radius:999px;padding:3px 8px;background:color-mix(in srgb,var(--accent),transparent 86%);color:var(--accent);font-size:12px;font-weight:800;}
    @media print{
      .no-print{display:none !important;}
      body{background:white !important;color:black !important;font-size:12px;}
      .app-shell{padding:0 !important;max-width:100% !important;}
      .panel{box-shadow:none !important;border:1px solid #ccc !important;}
      table{min-width:unset !important;}
      .dashboard-layout{grid-template-columns:1fr !important;}
      #contactPanel{display:none !important;}
      .conflict-banner-body{display:block !important;}
    }
    @media(max-width:960px){.dashboard-layout{grid-template-columns:1fr;}.toolbar{justify-content:start;}header{grid-template-columns:1fr;}}
    @media(max-width:620px){
      .app-shell{padding:12px 10px;}h1{font-size:20px;}h2{font-size:18px;}
      .kpis{grid-template-columns:1fr 1fr;}
      nav button{min-width:80px;padding:11px 8px;font-size:13px;}
      .toolbar{gap:5px;}
      .section-head{flex-direction:column;align-items:start;}
      .section-head-actions{width:100%;}
      td select,td input{font-size:13px;padding:5px 6px;}
      button{min-height:44px;}.icon-btn{min-height:36px;}.copy-field-btn{min-height:30px;}
      table{min-width:560px;}
    }
  </style>
</head>
<body data-theme="system">
  <div class="app-shell">
    <header>
      <div>

    <main>
      <section id="dashboard">

            <button class="primary" id="addCurrentYear">+ <span data-i18n="addMonth">Add Month</span></button>

        </div>
        <div id="conflictBanner" class="conflict-banner no-print" style="display:none">

        <div class="grid dashboard-layout">

                <th data-i18n="congregation">Congregation</th>

                <th data-i18n="followUpDate">Follow up by</th>
                <th data-i18n="note">Note</th>
                <th class="no-print" data-i18n="actions">Actions</th>
              </tr></thead>
              <tbody id="dashboardRows"></tbody>
            </table></div>
          </div>
          <aside class="panel" id="contactPanel">
            <div class="panel-title no-print">
              <strong data-i18n="speakerContact">Speaker contact</strong>

      </section>
      <section id="planning" hidden>

          <button class="primary" id="addPlanningYear">+ <span data-i18n="addYear">Add Year</span></button>
        </div>
        <div id="planningTables"></div>
      </section>
      <section id="congregations" hidden>

          <div class="list-tools">
            <input id="searchBox" class="search" type="search" data-i18n-placeholder="search" placeholder="Search">
            <button id="shareListBtn">&#129302; <span data-i18n="shareList">Share List</span></button>

            <th data-i18n="actions">Actions</th>
          </tr></thead>
          <tbody id="congregationRows"></tbody>
        </table></div></div>
      </section>
    </main>
  </div>

    function statusLabel(s){return tt({"not-contacted":"notContacted","message-sent":"messageSentStatus","confirmed":"confirmedStatus","needs-follow-up":"needsFollowUp"}[s]||"notContacted");}
    function norm(v){return String(v||"").toLowerCase().replace(/\s+/g," ").trim();}
    function findCong(name){var k=norm(name).replace("newlondon","new london");return state.congregations.find(function(c){return norm(c.name).replace("newlondon","new london")===k;});}
    function congOpts(sel){
      sel=sel||"";
      var names=Array.from(new Set(state.congregations.map(function(c){return c.name;}).filter(Boolean))).sort(function(a,b){return a.localeCompare(b);});
      if(sel&&names.indexOf(sel)===-1)names.unshift(sel);
      return '<option value=""></option>'+names.map(function(n){return'<option'+(n===sel?' selected':'')+'>'+esc(n)+'</option>';}).join("");
    }
    function esc(v){v=String(v==null?"":v);return v.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
    function telH(p){var c=String(p||"").replace(/[^\d+]/g,"");return c&&c.toUpperCase()!=="N/A"?"tel:"+c:"";}
    function smsH(p){var c=String(p||"").replace(/[^\d+]/g,"");return c&&c.toUpperCase()!=="N/A"?"sms:"+c:"";}
    function waH(p,txt){var c=String(p||"").replace(/[^\d+]/g,"");return(c?"https://wa.me/"+c:"https://wa.me/")+"?text="+encodeURIComponent(txt);}
    function mailH(email,cong,body){
      if(!email||String(email).toUpperCase()==="N/A")return"";
      var subj=encodeURIComponent(state.language==="es"?"Arreglo de discurso publico":"Public talk arrangement");
      var b=encodeURIComponent(body||(state.language==="es"?"Hola,\n\nQueria comunicarme sobre el arreglo con "+(cong||"su congregacion")+".\n\nGracias.":"Hello,\n\nI wanted to reach out about the arrangement with "+(cong||"your congregation")+".\n\nThank you."));
      return"mailto:"+email+"?subject="+subj+"&body="+b;
    }
    function fuClass(d){if(!d)return"";var diff=(new Date(d+"T00:00:00")-today)/86400000;return diff<0?"fu-overdue":diff<=7?"fu-soon":"";}
    function fuCell(d){var c=fuClass(d);return c==="fu-overdue"?"followup-overdue":c==="fu-soon"?"followup-soon":"";}
    function tmpl(row,name){var m=months()[row.month]||"";return state.language==="es"?"Saludos hermano/a, le contactamos para confirmar el arreglo del discurso publico del mes de "+m+" con la congregacion "+name+". Por favor confirme su disponibilidad. Gracias.":"Hello, we are reaching out to confirm the public talk arrangement for "+m+" with the "+name+" congregation. Please confirm your availability. Thank you.";}
    function computeWarnings(){
      var w=[];
      var s=state.schedule.slice().sort(function(a,b){return+a.month-+b.month;});
      for(var i=0;i<s.length;i++){if(!s[i].congregation)continue;for(var j=i+1;j<s.length;j++){if(!s[j].congregation)continue;if(norm(s[i].congregation)===norm(s[j].congregation)&&Math.abs(+s[j].month-+s[i].month)<=6)w.push(tf("duplicateCong",{c:s[i].congregation,m1:months()[s[i].month],m2:months()[s[j].month]}));}}
      FIXED.forEach(function(f){if(!state.schedule.some(function(r){return norm(r.congregation)===norm(f);}))w.push(tf("missingFixed",{c:f}));});
      return w;
    }
    function renderConflicts(){
      var w=computeWarnings(),banner=document.getElementById("conflictBanner"),body=document.getElementById("conflictBody"),lbl=document.getElementById("conflictLabel");
      if(!w.length){banner.style.display="none";return;}
      banner.style.display="";
      lbl.textContent="⚠ "+tf("conflictWarnings",{n:w.length});
      body.innerHTML=w.map(function(x){return'<div class="conflict-item">&bull; '+esc(x)+'</div>';}).join("");
    }
    function renderDataBadge(){
      var badge=document.getElementById("dataBadge");
      var n=state.congregations.filter(function(c){return(c.phone&&c.phone.trim())||(c.email&&c.email.trim());}).length;
      badge.className="data-badge "+(n>5?"badge-private":"badge-public");
      badge.textContent=(n>5?"📋 ":"⚠ ")+tt(n>5?"privateData":"publicData");
    }
    function renderDashboard(){
      var tbody=document.getElementById("dashboardRows");
      tbody.innerHTML=state.schedule.map(function(row){
        var fu=fuClass(row.followUpDate),futd=fuCell(row.followUpDate);
        var mOpts=months().map(function(m,i){return'<option value="'+i+'"'+(+row.month===i?' selected':'')+'>'+m+'</option>';}).join("");
        var sOpts=STATUS.map(function(s){return'<option value="'+s+'"'+(row.status===s?' selected':'')+'>'+statusLabel(s)+'</option>';}).join("");
        return'<tr class="'+(+row.month===currentMonth?'current':'')+'" data-id="'+row.id+'">'+
          '<td><select data-field="month">'+mOpts+'</select></td>'+
          '<td><select data-field="congregation">'+congOpts(row.congregation)+'</select></td>'+
          '<td><select data-field="status" class="status-select s-'+(row.status||"not-contacted")+'">'+sOpts+'</select></td>'+
          '<td class="'+futd+'"><input type="date" data-field="followUpDate" value="'+esc(row.followUpDate||"")+'" class="'+fu+'" style="min-width:130px;"></td>'+
          '<td><input data-field="note" value="'+esc(row.note||"")+'"></td>'+
          '<td class="no-print" style="white-space:nowrap"><button class="icon-btn" data-action="select">◎</button> <button class="icon-btn danger" data-action="delete">×</button></td>'+
        '</tr>';
      }).join("");
      var sel=state.schedule.find(function(r){return+r.month===+state.selectedMonth;})||state.schedule.find(function(r){return+r.month===currentMonth;})||state.schedule[0];
      renderContact(sel);renderKpis();renderConflicts();renderDataBadge();
    }
    function renderContact(row){
      var card=document.getElementById("contactCard");
      document.getElementById("selectedMonthLabel").textContent=row?months()[row.month]:"";
      if(!row||!row.congregation){card.innerHTML='<div class="empty">'+tt("noContact")+'</div>';return;}
      var c=findCong(row.congregation);
      if(!c){card.innerHTML='<div class="empty">'+tt("noContact")+'</div>';return;}
      var call=telH(c.phone),sms=smsH(c.phone),msg=tmpl(row,c.name);
      var mailBase=mailH(c.email,c.name,""),mailFull=mailH(c.email,c.name,msg);
      var smsBody=sms?sms+"?body="+encodeURIComponent(msg):"";
      var info=[c.name,c.coordinator?"Coord: "+c.coordinator:"",c.phone||"",c.email||""].filter(Boolean).join("\n");
      function lbtn(lbl,href,off){return off||!href?'<button disabled>'+lbl+'</button>':'<button data-href="'+esc(href)+'">'+lbl+'</button>';}
      function wbtn(lbl,href){return'<button data-wa-href="'+esc(href)+'">'+lbl+'</button>';}
      card.innerHTML=
        '<div><div class="contact-name">'+esc(c.name)+'</div><div class="muted">'+esc(c.coordinator||"")+'</div></div>'+
        '<div class="contact-meta"><div>'+tt("phone")+': <strong>'+esc(c.phone||"—")+'</strong></div><div>'+tt("email")+': <strong>'+esc(c.email||"—")+'</strong></div>'+(c.note?'<div>'+tt("note")+': '+esc(c.note)+'</div>':'')+'</div>'+
        '<div class="action-row no-print">'+lbtn("☎ "+tt("call"),call,!call)+lbtn("💬 "+tt("text"),sms,!sms)+lbtn("✉ "+tt("mail"),mailBase,!mailBase)+'<button data-copy="'+esc(c.phone||"")+'">&#10697; '+tt("phone")+'</button><button data-copy="'+esc(c.email||"")+'">&#10697; '+tt("email")+'</button>'+wbtn("🟢 "+tt("shareContact"),waH(c.phone,info))+'</div>'+
        '<div class="no-print"><div class="template-label">'+tt("templates")+'</div><div class="template-box">'+esc(msg)+'</div>'+
        '<div class="action-row" style="margin-top:8px">'+(smsBody?lbtn("📱 "+tt("openSms"),smsBody,false):"")+
        (mailFull?lbtn("✉ "+tt("openEmail"),mailFull,false):"")+
        '<button data-copy="'+esc(msg)+'">&#10697; '+tt("copyMsg")+'</button>'+wbtn("🟢 "+tt("whatsapp"),waH(c.phone,msg))+'</div></div>';
    }
    function renderKpis(){
      var tot=state.schedule.length,sent=state.schedule.filter(function(r){return r.status==="message-sent";}).length,conf=state.schedule.filter(function(r){return r.status==="confirmed";}).length;
      document.getElementById("kpiBox").innerHTML=[[tot,tt("total")],[sent,tt("sent")],[conf,tt("confirmedCount")]].map(function(x){return'<div class="kpi"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>';}).join("");
    }
    function renderPlanning(){
      var host=document.getElementById("planningTables");
      host.innerHTML=state.planning.map(function(year){
        var rows=year.rows.map(function(row){
          var mOpts=months().map(function(m,i){return'<option value="'+i+'"'+(+row.month===i?' selected':'')+'>'+m+'</option>';}).join("");
          return'<tr data-id="'+row.id+'">'+
            '<td><select data-field="month">'+mOpts+'</select></td>'+
            '<td><select data-field="congregation">'+congOpts(row.congregation)+'</select></td>'+
            '<td><input data-field="contact" value="'+esc(row.contact||lookupCoord(row.congregation))+'"></td>'+
            '<td><input data-field="confirmed" type="checkbox"'+(row.confirmed?' checked':'')+"></td>"+
            '<td><input data-field="note" value="'+esc(row.note||"")+'"></td>'+
          '</tr>';
        }).join("");
        return'<div class="panel planning-year" data-year="'+year.year+'">'+
          '<div class="panel-title"><strong>'+(state.language==="es"?"Arreglos para":"Arrangements for")+' '+year.year+'</strong><button class="icon-btn danger" data-action="delete-year">×</button></div>'+
          '<div class="table-wrap"><table>'+
            '<thead><tr><th>'+tt("month")+'</th><th>'+tt("conWho")+'</th><th>'+tt("contact")+'</th><th>'+tt("confirmedStatus")+'</th><th>'+tt("note")+'</th></tr></thead>'+
            '<tbody>'+rows+'</tbody>'+
          '</table></div>'+
        '</div>';
      }).join("");
    }
    function lookupCoord(name){var c=findCong(name);return c?c.coordinator:"";}
    function renderCongregations(){
      var filter=norm(document.getElementById("searchBox").value);
      var rows=state.congregations.filter(function(c){return!filter||[c.name,c.coordinator,c.phone,c.email,c.note].some(function(v){return norm(v).includes(filter);});}).sort(function(a,b){return a.name.localeCompare(b.name);});
      document.getElementById("congregationRows").innerHTML=rows.map(function(c){
        function fc(field,val){return'<td><div class="field-cell"><input data-field="'+field+'" value="'+esc(val)+'"><button class="copy-field-btn" data-copy="'+esc(val)+'" title="'+tt("copy")+'">&#10697;</button></div></td>';}
        return'<tr data-id="'+c.id+'">'+fc("name",c.name)+fc("coordinator",c.coordinator)+fc("phone",c.phone)+fc("email",c.email)+
          '<td><input data-field="note" value="'+esc(c.note)+'"></td>'+
          '<td style="white-space:nowrap"><button class="icon-btn danger" data-action="delete">×</button></td>'+
        '</tr>';
      }).join("")||'<tr><td colspan="6"><div class="empty">'+tt("noContact")+'</div></td></tr>';
    }
    function toast(msg){var el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove("show");},2400);}
    function renderAll(){
      document.body.dataset.theme=state.theme||"system";
      document.documentElement.lang=state.language;
      document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=tt(el.dataset.i18n);});
      document.querySelectorAll("[data-i18n-placeholder]").forEach(function(el){el.placeholder=tt(el.dataset.i18nPlaceholder);});
      document.getElementById("subtitle").textContent=tt("subtitle");
      document.getElementById("dashboardTitle").textContent=(state.language==="es"?"Arreglos de discursos ":"Talk arrangements ")+state.currentYear;
      document.getElementById("currentMonthPill").textContent=tt("currentMonth")+": "+months()[currentMonth];
      document.getElementById("printHeading").textContent=(state.language==="es"?"Arreglos de discursos ":"Talk arrangements ")+state.currentYear;
      document.getElementById("printDate").textContent=new Date().toLocaleDateString();
      document.querySelectorAll("[data-lang]").forEach(function(b){b.classList.toggle("active",b.dataset.lang===state.language);});
      document.querySelectorAll("[data-theme-pick]").forEach(function(b){b.classList.toggle("active",b.dataset.themePick===state.theme);});
      renderDashboard();renderPlanning();renderCongregations();
    }
    function rolloverYear(){
      var next=state.currentYear+1;
      if(!confirm(tf("confirmCreateYear",{year:next})))return;
      var fm={};state.schedule.forEach(function(row){if(FIXED.some(function(f){return norm(f)===norm(row.congregation);}))fm[+row.month]=row.congregation;});
      state.schedule=Array.from({length:12},function(_,i){return{id:crypto.randomUUID(),month:i,congregation:fm[i]||"",status:"not-contacted",followUpDate:"",note:fm[i]?(state.language==="es"?"Arreglo fijo":"Fixed arrangement"):""};});
      state.currentYear=next;state.selectedMonth=currentMonth;saveState();renderAll();toast(tf("yearCreated",{year:next})+" ✓");
    }
    function downloadBackup(){
      var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");a.href=url;a.download="talk-arrangements-backup-"+new Date().toISOString().slice(0,10)+".json";
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},2000);
      toast(tt("exported"));
    }
    function wireEvents(){
      document.querySelectorAll("[data-tab]").forEach(function(btn){btn.addEventListener("click",function(){document.querySelectorAll("[data-tab]").forEach(function(b){b.classList.remove("active");});btn.classList.add("active");document.querySelectorAll("main > section").forEach(function(s){s.hidden=s.id!==btn.dataset.tab;});});});
      document.querySelectorAll("[data-lang]").forEach(function(btn){btn.addEventListener("click",function(){state.language=btn.dataset.lang;saveState();renderAll();});});
      document.querySelectorAll("[data-theme-pick]").forEach(function(btn){btn.addEventListener("click",function(){state.theme=btn.dataset.themePick;saveState();renderAll();});});
      document.getElementById("dashboardRows").addEventListener("input",function(e){
        var tr=e.target.closest("tr");if(!tr)return;
        var row=state.schedule.find(function(r){return r.id===tr.dataset.id;});if(!row)return;
        var field=e.target.dataset.field;
        var val=e.target.type==="checkbox"?e.target.checked:field==="month"?+e.target.value:e.target.value;
        row[field]=val;saveState();
        if(field==="note")return;
        if(field==="followUpDate"){e.target.className=fuClass(val);e.target.closest("td").className=fuCell(val);return;}
        if(field==="status"){e.target.className="status-select s-"+val;renderKpis();renderConflicts();return;}
        if(field==="congregation"){state.selectedMonth=row.month;renderContact(state.schedule.find(function(r){return+r.month===+state.selectedMonth;}));renderKpis();renderConflicts();return;}
        if(field==="month"){state.selectedMonth=val;renderDashboard();return;}
        renderDashboard();
      });
      document.getElementById("dashboardRows").addEventListener("click",function(e){
        var tr=e.target.closest("tr");if(!tr)return;
        var row=state.schedule.find(function(r){return r.id===tr.dataset.id;});
        if(e.target.dataset.action==="select"&&row){state.selectedMonth=row.month;saveState();renderContact(row);document.querySelectorAll("#dashboardRows tr").forEach(function(r){r.style.outline="";});tr.style.outline="2px solid var(--accent)";}
        if(e.target.dataset.action==="delete"&&confirm(tt("deleteConfirm"))){state.schedule=state.schedule.filter(function(r){return r.id!==tr.dataset.id;});saveState();renderDashboard();}
      });
      document.getElementById("planningTables").addEventListener("input",function(e){
        var panel=e.target.closest("[data-year]"),tr=e.target.closest("tr");if(!panel||!tr)return;
        var year=state.planning.find(function(y){return String(y.year)===panel.dataset.year;});
        var row=year&&year.rows.find(function(r){return r.id===tr.dataset.id;});if(!row)return;
        var field=e.target.dataset.field;
        row[field]=e.target.type==="checkbox"?e.target.checked:field==="month"?+e.target.value:e.target.value;
        if(field==="congregation"&&!row.contact)row.contact=lookupCoord(row.congregation);
        saveState();
      });
      document.getElementById("planningTables").addEventListener("click",function(e){
        var panel=e.target.closest("[data-year]");
        if(e.target.dataset.action==="delete-year"&&panel&&confirm(tt("deleteConfirm"))){state.planning=state.planning.filter(function(y){return String(y.year)!==panel.dataset.year;});saveState();renderPlanning();}
      });
      document.getElementById("congregationRows").addEventListener("input",function(e){
        var tr=e.target.closest("tr"),c=state.congregations.find(function(i){return i.id===(tr&&tr.dataset.id);});if(!c)return;
        c[e.target.dataset.field]=e.target.value;saveState();renderDataBadge();
        var cb=e.target.nextElementSibling;if(cb&&cb.dataset.copy!==undefined)cb.dataset.copy=e.target.value;
      });
      document.getElementById("congregationRows").addEventListener("click",function(e){
        var tr=e.target.closest("tr");
        if(e.target.dataset.action==="delete"&&tr&&confirm(tt("deleteConfirm"))){state.congregations=state.congregations.filter(function(c){return c.id!==tr.dataset.id;});saveState();renderCongregations();renderDashboard();}
      });
      document.body.addEventListener("click",function(e){
        if(e.target.dataset.href){location.href=e.target.dataset.href;return;}
        if(e.target.dataset.waHref){window.open(e.target.dataset.waHref,"_blank");return;}
        var txt=e.target.dataset.copy;
        if(txt===undefined)return;
        if(txt===""){toast(tt("nothingToCopy"));return;}
        navigator.clipboard.writeText(txt).then(function(){toast(tt("copied")+": "+txt.slice(0,60));});
      });
      document.getElementById("searchBox").addEventListener("input",renderCongregations);
      document.getElementById("exportBtn").addEventListener("click",downloadBackup);
      document.getElementById("importBtn").addEventListener("click",function(){document.getElementById("importFile").click();});
      document.getElementById("importFile").addEventListener("change",function(e){
        var file=e.target.files[0];if(!file)return;
        var reader=new FileReader();
        reader.onload=function(){
          try{
            var imp=JSON.parse(reader.result);
            if(!Array.isArray(imp.congregations)||!Array.isArray(imp.schedule))throw new Error("Invalid");
            state=Object.assign(cloneStarter(),imp);
            state.schedule=state.schedule.map(migrateRow);
            if(Array.isArray(state.planning))state.planning.forEach(function(y){if(Array.isArray(y.rows))y.rows.forEach(function(r){if(r.contact===undefined)r.contact="";if(r.confirmed===undefined)r.confirmed=false;});});
            saveState();renderAll();toast(tt("imported"));
          }catch(err){toast(tt("invalidBackup"));}
          e.target.value="";
        };
        reader.readAsText(file);
      });
      document.getElementById("resetBtn").addEventListener("click",function(){if(!confirm(tt("deleteConfirm")))return;state=cloneStarter();state.schedule=state.schedule.map(migrateRow);saveState();renderAll();toast(tt("restored"));});
      document.getElementById("addCurrentYear").addEventListener("click",function(){state.schedule.push({id:crypto.randomUUID(),month:currentMonth,congregation:"",status:"not-contacted",followUpDate:"",note:""});saveState();renderDashboard();});
      document.getElementById("addPlanningYear").addEventListener("click",function(){
        var next=Math.max.apply(null,state.planning.map(function(y){return+y.year;}).concat([state.currentYear]))+1;
        state.planning.push({year:next,rows:Array.from({length:12},function(_,i){return{id:crypto.randomUUID(),month:i,congregation:"",contact:"",confirmed:false,note:""};})});
        saveState();renderPlanning();
        toast(next+" "+(state.language==="es"?"anadido ✓":"added ✓"));
        setTimeout(function(){var el=document.querySelector('[data-year="'+next+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"start"});},80);
      });
      document.getElementById("addCongregation").addEventListener("click",function(){
        var nid=crypto.randomUUID();state.congregations.push({id:nid,name:"",coordinator:"",phone:"",email:"",note:""});
        saveState();renderCongregations();
        setTimeout(function(){var r=document.querySelector('#congregationRows tr[data-id="'+nid+'"]');if(r){r.scrollIntoView({behavior:"smooth",block:"nearest"});var i=r.querySelector("input");if(i)i.focus();}},80);
      });
      document.getElementById("rolloverBtn").addEventListener("click",rolloverYear);
      document.getElementById("printBtn").addEventListener("click",function(){document.getElementById("printTitle").style.display="";window.print();setTimeout(function(){document.getElementById("printTitle").style.display="none";},500);});
      document.getElementById("shareListBtn").addEventListener("click",function(){
        var lines=state.congregations.filter(function(c){return c.name;}).sort(function(a,b){return a.name.localeCompare(b.name);}).map(function(c){var l="*"+c.name+"*";if(c.coordinator)l+="\n"+tt("coordinator")+": "+c.coordinator;if(c.phone)l+="\n"+tt("phone")+": "+c.phone;if(c.email)l+="\n"+tt("email")+": "+c.email;return l;}).join("\n\n");
        window.open("https://wa.me/?text="+encodeURIComponent(lines),"_blank");
      });
      document.getElementById("conflictToggle").addEventListener("click",function(){document.getElementById("conflictBody").classList.toggle("open");});
    }
    wireEvents();renderAll();
  </script>
</body>
</html>
